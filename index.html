<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />

<title>RU ↔ SR Translator</title>
<style>
:root{--bg:#0b0b0b;--text:#f5f3f6;--muted:#7f7b82;--violet:#6e52aa;--violet2:#a084dc;--line:#5a5660;--card:#151416;--btn:#242324}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#202020;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif}
body{display:grid;place-items:start center;padding:30px 0 20px;overflow-x:hidden}.phone{position:relative;width:min(402px,100vw);height:min(874px,calc(100dvh - 30px));min-height:720px;overflow:hidden;border-radius:40px;background:radial-gradient(240px 300px at -10% 48%,rgba(91,54,145,.32),transparent 70%),radial-gradient(260px 300px at 112% 64%,rgba(86,58,139,.38),transparent 72%),#0b0b0b;padding:18px 18px 10px;display:flex;flex-direction:column}
.top{height:72px;flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:start}
.top-left,.top-center,.top-right{min-width:0;height:72px}
.top-left{display:flex;flex-direction:column;align-items:flex-start;padding-top:10px}
.emoji-row{display:flex;align-items:center;gap:6px}
.emoji-svg{width:24px;height:20px;display:block}.emoji-svg.hand{width:26px;height:21px}
.top-sub{margin-top:12px;font-size:9px;letter-spacing:2px;color:#77727b;white-space:nowrap}
.top-center{display:flex;align-items:flex-start;justify-content:center}
.brand{width:54px;height:54px;display:block;margin-top:-2px}
.top-right{display:flex;justify-content:flex-end;align-items:flex-start}
.meta{    text-align: right;
    color: #77727b;
    letter-spacing: 2px;
    font-size: 11px;
    line-height: 18px;
    padding-top: 3px;
    padding-right: 3px;
    white-space: nowrap;}
.rate{font-size:10px;white-space:nowrap}
.cards{display:flex;flex-direction:column;gap:18px;flex:1;min-height:0}.card{position:relative;border-radius:25px;overflow:hidden;padding:16px 17px;background:linear-gradient(105deg,rgba(255,255,255,.045),rgba(255,255,255,.025));backdrop-filter:blur(20px)}.source{flex:1.02}.target{flex:1;border:1px solid rgba(214,207,223,.34);background:linear-gradient(105deg,rgba(255,255,255,.02),rgba(68,53,90,.09));padding-bottom:78px}.label{font-size:13px;color:#7f7b82;margin-bottom:6px;display:flex;align-items:center;gap:5px}.mini-flag{width:13px;height:9px;display:inline-block;vertical-align:0}textarea{width:100%;height:calc(100% - 25px);resize:none;border:0;outline:0;background:transparent;color:#f5f3f6;font:600 21px/1.35 inherit;padding:0 13px 0 0;caret-color:#b89be8;overflow-y:auto;overflow-x:hidden;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;scrollbar-color:#5d4b78 transparent;scrollbar-width:thin}textarea::placeholder{color:#f4f1f4;opacity:1}.result{font-size:21px;line-height:1.42;font-weight:650;white-space:pre-wrap;overflow-y:auto;overflow-x:hidden;height:calc(100% - 26px);padding-right:10px;scrollbar-color:#5d4b78 transparent;scrollbar-width:thin;overflow-wrap:anywhere;word-break:break-word;max-width:100%}textarea::-webkit-scrollbar,.result::-webkit-scrollbar{width:6px;height:0}textarea::-webkit-scrollbar-track,.result::-webkit-scrollbar-track{background:transparent}textarea::-webkit-scrollbar-thumb,.result::-webkit-scrollbar-thumb{background:#5d4b78;border-radius:999px}textarea::-webkit-scrollbar-thumb:hover,.result::-webkit-scrollbar-thumb:hover{background:#765f99}.result.empty{color:#f4f1f4}.word{display:inline;border-radius:5px;transition:.08s;cursor:pointer}.word.active{background:rgba(255,255,255,.16)}.word.related{text-decoration:underline 2px #77758a;text-underline-offset:4px}.source-mark{background:transparent;text-decoration:underline 2px #59576a;text-underline-offset:5px}.source-mark.playing{background:rgba(116,91,157,.24)}
.actions{position:absolute;left:14px;right:14px;bottom:13px;display:flex;gap:10px}.speak,.copy{height:60px;border:0;color:white;background:linear-gradient(#2a292a,#1f1f20);font:600 16px inherit;cursor:pointer}.speak{flex:1;border-radius:32px;display:flex;gap:7px;align-items:center;justify-content:center}.copy{width:68px;border-radius:31px;display:grid;place-items:center}.speak:disabled,.copy:disabled{opacity:.45}.icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bottom{height:133px;position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between; padding: 13px 10px 4px 10px;}.switch{position:relative;left:auto;top:auto;width:61px;height:116px;border:0;border-radius:31px;background:rgba(255,255,255,.09);cursor:pointer;flex:0 0 61px}.knob{position:absolute;left:4px;top:4px;width:53px;height:61px;border-radius:27px;background:radial-gradient(circle at 40% 25%,#8f7aae,#504565 63%,#2c2734 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.16);transition:transform .35s cubic-bezier(.2,.8,.2,1)}.switch.swapped .knob{transform:translateY(47px)}.lang{position:absolute;left:0;width:100%;z-index:2;font-size:12px;font-weight:800;color:#fff}.lang.a{top:26px}.lang.b{bottom:24px;color:#d6d3d8}.switch.swapped .lang.a{color:#d6d3d8}.switch.swapped .lang.b{color:#fff}

.mic{
position:relative;left:auto;top:auto;transform:none;width:116px;height:116px;flex:0 0 116px;
border-radius:50%;border:2px solid transparent;
background:linear-gradient(#111011,#111011) padding-box,
linear-gradient(90deg,rgba(255,255,255,.30) 0%,rgba(204,204,204,0) 50%,rgba(255,255,255,.30) 100%) border-box;
display:grid;place-items:center;color:#e6e3e8;cursor:pointer;overflow:hidden;isolation:isolate;
-webkit-appearance:none;appearance:none;padding:0;
transition:transform .28s cubic-bezier(.2,.75,.25,1),filter .35s ease;
transform-origin:center center;will-change:transform;
}
.mic-surface{position:absolute;inset:0;border-radius:50%;z-index:0;pointer-events:none;
background:
radial-gradient(ellipse 95% 48% at 50% 111%,rgba(98,66,163,.82) 0%,rgba(98,66,163,.34) 42%,transparent 72%),
radial-gradient(ellipse 92% 38% at 50% 104%,rgba(184,138,71,.52) 0%,rgba(184,138,71,.18) 43%,transparent 72%),
radial-gradient(ellipse 95% 32% at 50% 96%,rgba(255,255,255,.34) 0%,rgba(255,255,255,.10) 45%,transparent 74%),
radial-gradient(circle at 50% -4%,rgba(255,255,255,.17),transparent 43%),
linear-gradient(180deg,#171617 0%,#111011 58%,#17141a 100%);}
.mic-surface::after{content:"";position:absolute;inset:1px;border-radius:50%;
border-top:1px solid rgba(255,255,255,.20);border-bottom:1px solid rgba(255,255,255,.08);pointer-events:none;}
.mic::before{display:none;
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    z-index: 1;
}
.mic::after{display:none;
    content: "";
    position: absolute;
    inset: 0px;
    border-radius: inherit;
    pointer-events: none;
    z-index: 8;
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .20), inset 0 -2px 0 rgba(255, 255, 255, .08);
}
.mic .icon{position:relative;z-index:10;width:37px;height:37px;stroke-width:2.4}
.mic-wave{position:absolute;pointer-events:none;left:-25%;width:150%;height:90%;border-radius:45% 55% 50% 48%;opacity:0;transform-origin:50% 50%;filter:blur(2px);transition:opacity .35s ease;z-index:4}
.wave-1 {
    bottom: -48%;
    background: radial-gradient(
        ellipse at center,
        rgba(126, 103, 151, .48) 0%,
        rgba(91, 72, 112, .38) 42%,
        rgba(54, 45, 65, .16) 68%,
        transparent 74%
    );
}

.wave-2 {
    bottom: -54%;
    background: radial-gradient(
        ellipse at center,
        rgba(194, 168, 190, .36) 0%,
        rgba(139, 111, 145, .26) 45%,
        rgba(74, 59, 82, .10) 68%,
        transparent 75%
    );
}

.wave-3 {
    bottom: -58%;
    background: radial-gradient(
        ellipse at center,
        rgba(91, 69, 111, .42) 0%,
        rgba(66, 50, 82, .28) 48%,
        rgba(39, 32, 47, .10) 70%,
        transparent 76%
    );
}
.mic.listening .mic-wave{opacity:1}
.mic.listening .wave-1{animation:liquidWave1 3.2s linear infinite,waveRise1 2.2s ease-in-out infinite alternate}
.mic.listening .wave-2{animation:liquidWave2 4.3s linear infinite,waveRise2 2.8s ease-in-out infinite alternate}
.mic.listening .wave-3{animation:liquidWave3 5.2s linear infinite,waveRise3 3.3s ease-in-out infinite alternate}
.mic.listening{
animation:micGlow 2.4s ease-in-out infinite alternate,micBreath 1.8s cubic-bezier(.45,0,.55,1) infinite;
transform-origin:center center;
}
.mic.listening.voice-hit{
animation:micGlow 2.4s ease-in-out infinite alternate,micBreath 1.8s cubic-bezier(.45,0,.55,1) infinite;
}
@keyframes micBreath{
0%,100%{transform:scale(1)}
50%{transform:scale(1.035)}
}
@keyframes liquidWave1{from{transform:rotate(0deg) scale(1.05)}to{transform:rotate(360deg) scale(1.05)}}
@keyframes liquidWave2{from{transform:rotate(360deg) scale(1.08)}to{transform:rotate(0deg) scale(1.08)}}
@keyframes liquidWave3{from{transform:rotate(-20deg) scale(1.1)}to{transform:rotate(340deg) scale(1.1)}}
@keyframes waveRise1{from{bottom:-54%}to{bottom:-32%}}
@keyframes waveRise2{from{bottom:-60%}to{bottom:-38%}}
@keyframes waveRise3{from{bottom:-62%}to{bottom:-42%}}
@keyframes micGlow{
from{filter:brightness(1)}
to{filter:brightness(1.07)}
}
.clear{position:relative;right:auto;top:auto;width:45px;height:45px;flex:0 0 45px;border-radius:50%;border:0;background:#202020;color:#666;font-size:29px;font-weight:200;line-height:1;cursor:pointer}.dev{    height: 11px;
    text-align: center;
    color: #57535b;
    font-size: 10px;
    letter-spacing: 3px;
    white-space: nowrap;
    flex: 0 0 auto;
    margin-top: 10px;}
.menu{position:fixed;z-index:99;min-width:170px;max-width:260px;padding:7px;border-radius:14px;background:rgba(36,34,39,.97);border:1px solid rgba(255,255,255,.16);box-shadow:0 12px 35px rgba(0,0,0,.45);display:none}.menu.show{display:block}.menu button{display:block;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:10px 12px;border-radius:9px;font:500 15px inherit}.menu button:hover{background:rgba(255,255,255,.09)}.toast{position:absolute;left:50%;bottom:142px;transform:translateX(-50%) translateY(8px);background:#2a282c;border:1px solid rgba(255,255,255,.12);padding:8px 12px;border-radius:20px;color:#c9c4ce;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:430px){body{padding:0}.phone{width:100vw;height:100dvh;border-radius:0;min-height:640px}.source,.target{border-radius:24px}.bottom{height:130px}}

@supports(height:100svh){@media(max-width:430px){.phone{height:100svh}}}
.target{cursor:zoom-in}
.target.expanded{    position: fixed;
    z-index: 500;
    inset: 0;
    width: calc(100vw - 20px);
    height: calc(100dvh - 20px);
    max-width: none;
    max-height: none;
    border-radius: 0;
    padding: calc(22px + env(safe-area-inset-top)) 22px calc(92px + env(safe-area-inset-bottom));
    background: radial-gradient(300px 420px at -5% 50%, rgba(91, 54, 145, .30), transparent 72%), radial-gradient(320px 420px at 105% 65%, rgba(86, 58, 139, .34), transparent 72%), #0b0b0b;
    cursor: zoom-out;
    border-radius: 40px;
    margin: 10px 10px;
    transition: 0.5s;
}
.target.expanded .result{height:calc(100% - 34px);font-size:24px;line-height:1.48;padding-right:12px}
.target.expanded .actions{left:18px;right:18px;bottom:calc(16px + env(safe-area-inset-bottom))}
body.target-open{overflow:hidden;touch-action:none}

</style>

<script>
const $=s=>document.querySelector(s), input=$('#input'), result=$('#result'), swap=$('#swap'), mic=$('#mic'), clear=$('#clear'), speak=$('#speak'), copy=$('#copy'), menu=$('#menu'), sourceCard=$('#sourceCard');
let direction='ru-sr', timer=0, controller=null, seq=0, translated='', pressTimer=0, recognition=null;
const FLAGS={ru:'<svg class="mini-flag" viewBox="0 0 18 12"><path fill="#fff" d="M0 0h18v4H0z"/><path fill="#1764b0" d="M0 4h18v4H0z"/><path fill="#e33b45" d="M0 8h18v4H0z"/></svg>',sr:'<svg class="mini-flag" viewBox="0 0 18 12"><path fill="#df3340" d="M0 0h18v4H0z"/><path fill="#174d9a" d="M0 4h18v4H0z"/><path fill="#fff" d="M0 8h18v4H0z"/></svg>'};
function langs(){return direction==='ru-sr'?['ru','sr']:['sr','ru']}
function labels(){const [a,b]=langs();$('#sourceLabel').innerHTML=FLAGS[a]+(a==='ru'?'Введите текст':'Unesite tekst');$('#targetLabel').innerHTML=FLAGS[b]+(b==='sr'?'Сербский перевод':'Русский перевод');input.placeholder=a==='ru'?'Напишите фразу':'Napišite frazu'}labels();
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function googleTranslate(text,from,to,extra=false,signal){const params=new URLSearchParams({client:'gtx',sl:from,tl:to,dt:'t',q:text});if(extra)params.append('dt','at');const r=await fetch('https://translate.googleapis.com/translate_a/single?'+params,{signal,cache:'no-store'});if(!r.ok)throw Error('translate '+r.status);const d=await r.json();return {text:(d[0]||[]).map(x=>x?.[0]||'').join(''),raw:d}}
async function translate(text,from,to,signal){if(location.protocol==='http:'||location.protocol==='https:'){try{const r=await fetch('/api/translate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,from,to}),signal});if(r.ok){const d=await r.json();if(d.translation)return {text:d.translation,raw:d}}}catch(e){if(e.name==='AbortError')throw e}}return googleTranslate(text,from,to,false,signal)}
function renderText(t){translated=t;const parts=t.split(/(\s+)/);let wi=0;result.innerHTML=parts.map(p=>/^\s+$/.test(p)?p:`<span class="word" data-i="${wi++}">${esc(p)}</span>`).join('');result.classList.remove('empty');speak.disabled=copy.disabled=false;bindWords()}
async function perform(){const text=input.value.trim(), my=++seq;if(controller)controller.abort();controller=new AbortController();sourceCard.classList.toggle('hastext',!!text);if(!text){translated='';result.textContent='Здесь появится перевод...';result.className='result empty';speak.disabled=copy.disabled=true;return}try{const [from,to]=langs(),r=await translate(text,from,to,controller.signal);if(my!==seq)return;if(r.text)renderText(r.text)}catch(e){if(e.name!=='AbortError')toast('Ошибка перевода')}}
input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(perform,180)});
function swapNow(){const oldSource=input.value.trim(),oldTarget=translated.trim();direction=direction==='ru-sr'?'sr-ru':'ru-sr';swap.classList.toggle('swapped',direction==='sr-ru');labels();closeMenu();if(oldTarget){input.value=oldTarget;translated='';perform()}else if(oldSource)perform()}
swap.addEventListener('click',swapNow);clear.addEventListener('click',e=>{
 e.preventDefault();e.stopPropagation();
 if(controller)controller.abort();seq++;
 input.value='';translated='';
 result.textContent='Здесь появится перевод...';result.className='result empty';
 sourceCard.classList.remove('hastext');speak.disabled=copy.disabled=true;
 closeMenu();
 input.blur();
});
copy.addEventListener('click',async()=>{if(!translated)return;await navigator.clipboard.writeText(translated);toast('Скопировано')});
let currentAudio=null,lastAudioAt=0;
function googleTtsUrl(text,lang){
 const tl=lang==='sr'?'sr':'ru';
 return 'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl='+encodeURIComponent(tl)+'&q='+encodeURIComponent(text)+'&_='+Date.now();
}
function speakText(text,lang){
 if(!text)return;
 if(currentAudio){try{currentAudio.pause();currentAudio.removeAttribute('src');currentAudio.load()}catch{}currentAudio=null}
 const audio=new Audio();
 currentAudio=audio;audio.preload='auto';audio.playsInline=true;
 audio.src=googleTtsUrl(text,lang);audio.playbackRate=.95;
 const done=()=>{lastAudioAt=Date.now();if(currentAudio===audio)currentAudio=null};
 audio.addEventListener('ended',done,{once:true});
 audio.addEventListener('error',()=>{done();toast('Google-озвучка недоступна')},{once:true});
 const p=audio.play();
 if(p?.catch)p.catch(()=>{done();toast('Google-озвучка недоступна')});
}
speak.addEventListener('click',()=>{const [,to]=langs();speakText(translated,to)});
function bindWords(){result.querySelectorAll('.word').forEach(w=>{let sx=0,sy=0,longPressed=false;w.addEventListener('click',e=>{if(longPressed){e.preventDefault();longPressed=false;return}playWord(w)});w.addEventListener('contextmenu',e=>{e.preventDefault();showAlternatives(w,e.clientX,e.clientY)});w.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;clearTimeout(pressTimer);pressTimer=setTimeout(()=>{longPressed=true;showAlternatives(w,sx,sy)},450)});w.addEventListener('pointerup',()=>clearTimeout(pressTimer));w.addEventListener('pointercancel',()=>clearTimeout(pressTimer));w.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>9)clearTimeout(pressTimer)})})}
async function playWord(w){closeMenu();result.querySelectorAll('.word').forEach(x=>x.classList.remove('active'));w.classList.add('active');const [,to]=langs();speakText(w.textContent.replace(/[.,!?;:]+$/,''),to);await underlineSourceFor(w);setTimeout(()=>w.classList.remove('active'),650)}
async function underlineSourceFor(w){const src=input.value.trim();if(!src)return;const srcWords=src.split(/(\s+)/), tgtWords=[...result.querySelectorAll('.word')], idx=tgtWords.indexOf(w);const plain=src.split(/\s+/);let pick=plain[Math.min(idx,plain.length-1)]||plain[0];try{const [from,to]=langs();let best=-1;for(const sw of plain){const r=await googleTranslate(sw,from,to,false);const score=r.text.toLowerCase().includes(w.textContent.toLowerCase().replace(/\W/g,''))?1:0;if(score>best){best=score;pick=sw}if(score===1)break}}catch{}const pos=src.indexOf(pick);if(pos>=0){input.focus();input.setSelectionRange(pos,pos+pick.length)}}
async function showAlternatives(w,x,y){
  clearTimeout(pressTimer);
  navigator.vibrate?.(18);
  result.querySelectorAll('.word').forEach(a=>a.classList.remove('active'));
  w.classList.add('active');

  const word=w.textContent.replace(/[.,!?;:]+$/,'').trim();
  const [from,to]=langs();
  let opts=[];

  // IMPORTANT:
  // The popup must contain alternatives in the SAME language as the clicked
  // translated word. Example: RU -> SR result => popup contains Serbian.
  try{
    // First find the likely source word corresponding to the clicked target word.
    const back=await googleTranslate(word,to,from,true);
    const sourceCandidates=[];
    if(back.text)sourceCandidates.push(back.text);

    const collectSource=o=>{
      if(Array.isArray(o))o.forEach(collectSource);
      else if(typeof o==='string' && o.trim().length<60)sourceCandidates.push(o.trim());
    };
    collectSource(back.raw?.[1]);
    collectSource(back.raw?.[5]);

    // Translate those source-language candidates BACK to the target language.
    // This prevents Russian words from appearing in a Serbian alternatives menu.
    for(const sourceWord of [...new Set(sourceCandidates)].slice(0,8)){
      try{
        const rr=await googleTranslate(sourceWord,from,to,true);
        if(rr.text)opts.push(rr.text);

        const collectTarget=o=>{
          if(Array.isArray(o))o.forEach(collectTarget);
          else if(typeof o==='string' && o.trim().length<60)opts.push(o.trim());
        };
        collectTarget(rr.raw?.[1]);
        collectTarget(rr.raw?.[5]);
      }catch{}
    }

    // Also ask Google for alternatives for the whole original sentence,
    // but keep only target-language-looking entries.
    const src=input.value.trim();
    if(src){
      const whole=await googleTranslate(src,from,to,true);
      if(whole.text)opts.push(whole.text);
      const collectWhole=o=>{
        if(Array.isArray(o))o.forEach(collectWhole);
        else if(typeof o==='string' && o.trim().length<90)opts.push(o.trim());
      };
      collectWhole(whole.raw?.[1]);
      collectWhole(whole.raw?.[5]);
    }
  }catch{}

  const cyrillic=/[\u0400-\u04FF]/;
  const serbianCyr=/[ђјљњћџ]/i;
  const russianOnly=/[ёыэъ]/i;

  function targetLanguageScore(s){
    s=s.trim();
    if(!s)return -999;

    if(to==='sr'){
      let score=0;
      if(/[čćžšđ]/i.test(s))score+=5;
      if(serbianCyr.test(s))score+=5;
      if(russianOnly.test(s))score-=8;
      // Serbian may legitimately be Cyrillic, so don't reject Cyrillic itself.
      if(/\b(je|nije|da|šta|sto|kako|gde|ovo|to|sam|si|smo|ste|su|košta|koliko|tamo|ovde|zdravo)\b/i.test(s))score+=4;
      return score;
    }

    // RU target: favor Russian-specific letters/words.
    let score=0;
    if(russianOnly.test(s))score+=5;
    if(/\b(это|как|где|что|сколько|стоит|там|здесь|привет|она|он|они)\b/i.test(s))score+=3;
    return score;
  }

  opts=[...new Set(
    opts.map(s=>s.replace(/\s+/g,' ').trim())
        .filter(s=>s && s.toLowerCase()!==word.toLowerCase())
  )];

  // For Serbian target, remove candidates that strongly look Russian.
  if(to==='sr'){
    opts=opts.filter(s=>!russianOnly.test(s));
  }

  opts.sort((a,b)=>targetLanguageScore(b)-targetLanguageScore(a));
  opts=opts.slice(0,7);

  if(!opts.length){
    opts=[to==='sr'?'Нема додатних варијанти':'Нет дополнительных вариантов'];
  }

  menu.innerHTML=
    '<div style="padding:7px 12px 5px;color:#8e8993;font-size:11px">'+
    (to==='sr'?'ВАРИЈАНТЕ ПРЕВОДА':'ВАРИАНТЫ ПЕРЕВОДА')+
    '</div>'+
    opts.map(o=>`<button type="button">${esc(o)}</button>`).join('');

  menu.style.left=Math.max(8,Math.min(x,innerWidth-275))+'px';
  menu.style.top=Math.max(8,Math.min(y+12,innerHeight-300))+'px';
  menu.classList.add('show');

  menu.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    navigator.clipboard?.writeText(b.textContent);
    toast('Вариант скопирован');
    closeMenu();
  });
}
function closeMenu(){menu.classList.remove('show')}document.addEventListener('pointerdown',e=>{if(!menu.contains(e.target)&&!e.target.classList.contains('word'))closeMenu()});
function tick(){
  const d=new Date();
  $('#clock').textContent=new Intl.DateTimeFormat('sr-RS',{
    hour:'2-digit',minute:'2-digit',hour12:false
  }).format(d);

  const dateParts=new Intl.DateTimeFormat('sr-Latn-RS',{
    day:'2-digit',
    month:'long'
  }).formatToParts(d);

  const day=dateParts.find(p=>p.type==='day')?.value||String(d.getDate()).padStart(2,'0');
  const month=dateParts.find(p=>p.type==='month')?.value||'';
  $('#date').textContent=(day+' '+month).toUpperCase();
}
tick();
setInterval(tick,1000);

const RATE_CACHE_KEY='rsd-rub-live-rate-v1';
function showRate(v){
  if(Number.isFinite(v)&&v>0){
    $('#rate').textContent='1 RSD = ~ '+v.toFixed(2).replace('.',',')+' RUB';
  }
}
function cachedRate(){
  try{
    const c=JSON.parse(localStorage.getItem(RATE_CACHE_KEY)||'null');
    if(c&&Number.isFinite(c.value))showRate(c.value);
  }catch{}
}
async function rate(){
  const urls=[
    'https://open.er-api.com/v6/latest/RSD',
    'https://api.frankfurter.app/latest?from=RSD&to=RUB'
  ];
  for(const url of urls){
    try{
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok)continue;
      const d=await r.json();
      const v=Number(d?.rates?.RUB);
      if(Number.isFinite(v)&&v>0){
        showRate(v);
        try{localStorage.setItem(RATE_CACHE_KEY,JSON.stringify({value:v,at:Date.now()}))}catch{}
        return;
      }
    }catch{}
  }
  cachedRate();
}
cachedRate();
rate();
setInterval(rate,30*60*1000);
function stopVoiceReactive(){}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognitionLang='',srFallbackIndex=0,recognitionStarting=false;
const SR_IOS_LANGS=['sr-RS','sr-Latn-RS','hr-HR'];
const SR_LATIN=/[čćžšđ]/i,SR_CYRILLIC=/[ђјљњћџчћжш]/i;
const ENGLISH_HINT=/\b(the|a|an|and|or|is|are|was|were|this|that|take|off|pass|you|your|we|they|to|of|in|on|for|with|my|me|it)\b/gi;
const SERBIAN_HINT=/\b(ja|ti|on|ona|mi|vi|oni|sam|si|je|smo|ste|su|nije|ne|da|šta|sto|kako|gde|gdje|ovo|to|taj|ta|pas|psa|dobar|dobra|dobro|imam|ima|hoću|hocu|mogu|može|moze|treba|zdravo|hvala|molim|samo|sad|sada)\b/gi;
function serbianScore(text,confidence=0){let score=(Number(confidence)||0)*2;
score+=(text.match(new RegExp(SR_LATIN.source,'gi'))||[]).length*2.5;
score+=(text.match(new RegExp(SR_CYRILLIC.source,'gi'))||[]).length*2.5;
score+=(text.match(SERBIAN_HINT)||[]).length*1.7;score-=(text.match(ENGLISH_HINT)||[]).length*2.2;return score}
function bestRecognitionAlternative(rs,isSerbian){const c=[];for(let j=0;j<rs.length;j++)c.push({text:(rs[j].transcript||'').trim(),confidence:rs[j].confidence||0});
if(!c.length)return '';if(!isSerbian)return c[0].text;c.sort((a,b)=>serbianScore(b.text,b.confidence)-serbianScore(a.text,a.confidence));return c[0].text}
function makeRecognition(){
if(!SR)return null;const r=new SR();r.interimResults=true;r.continuous=false;r.maxAlternatives=5;
r.onstart=()=>{recognitionStarting=false;mic.classList.add('listening')};
r.onend=()=>{recognitionStarting=false;mic.classList.remove('listening');stopVoiceReactive()};
r.onresult=e=>{const isSerbian=langs()[0]==='sr';let t='';for(let i=0;i<e.results.length;i++){const p=bestRecognitionAlternative(e.results[i],isSerbian);if(p)t+=(t?' ':'')+p}
input.value=t;sourceCard.classList.add('hastext');clearTimeout(timer);timer=setTimeout(perform,100)};
r.onerror=e=>{recognitionStarting=false;mic.classList.remove('listening');stopVoiceReactive();
if(langs()[0]==='sr'&&(e.error==='language-not-supported'||e.error==='service-not-allowed')&&srFallbackIndex<SR_IOS_LANGS.length-1){srFallbackIndex++;setTimeout(()=>startRecognition(true),220);return}
if(e.error==='no-speech'||e.error==='aborted')return;
if(e.error==='not-allowed'||e.error==='service-not-allowed'){toast('Safari не дал доступ к распознаванию речи');return}
if(e.error==='audio-capture'){toast('Микрофон недоступен');return}toast('Не удалось распознать речь')};return r}
recognition=makeRecognition();
async function primeMicrophone(){if(!navigator.mediaDevices?.getUserMedia)return;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop())}catch{}}
async function startRecognition(isFallback=false){
if(!SR)return toast('Голосовой ввод не поддерживается');if(recognitionStarting)return;
const sourceLang=langs()[0];if(!isFallback)srFallbackIndex=0;
if(currentAudio){try{currentAudio.pause();currentAudio.removeAttribute('src');currentAudio.load()}catch{}currentAudio=null;lastAudioAt=Date.now()}
await primeMicrophone();
try{recognition?.abort()}catch{}recognition=makeRecognition();if(!recognition)return;
recognitionLang=sourceLang==='sr'?SR_IOS_LANGS[srFallbackIndex]:'ru-RU';recognition.lang=recognitionLang;
const sinceAudio=Date.now()-lastAudioAt;if(sinceAudio<500)await new Promise(r=>setTimeout(r,500-sinceAudio));
recognitionStarting=true;mic.classList.add('listening');try{recognition.start()}catch(e){recognitionStarting=false;mic.classList.remove('listening');if(e?.name!=='InvalidStateError')toast('Не удалось запустить запись')}}
mic.addEventListener('click',()=>startRecognition(false));

const targetCard=$('#targetCard');
function toggleTargetFullscreen(){const open=targetCard.classList.toggle('expanded');document.body.classList.toggle('target-open',open);if(open)result.scrollTop=0}
targetCard.addEventListener('click',e=>{if(e.target.closest('.word,.actions,button,svg,path'))return;toggleTargetFullscreen()});
